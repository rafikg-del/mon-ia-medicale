name: Deploy YouTube Scraper PWA

# Construit la PWA (dossier youtube-scraper-app) et la publie sur GitHub Pages.
# URL finale : https://<utilisateur>.github.io/mon-ia-medicale/
on:
  push:
    branches:
      - main
      - claude/youtube-scraper-pwa-vlnr5q
    paths:
      - "youtube-scraper-app/**"
      - ".github/workflows/deploy-pwa.yml"
  workflow_dispatch: {}

# Permissions requises pour publier sur Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: youtube-scraper-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: youtube-scraper-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build PWA
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Active GitHub Pages automatiquement (source = GitHub Actions)
          # afin d'éviter toute manipulation dans les réglages du dépôt.
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: youtube-scraper-app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
